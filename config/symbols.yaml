# ==============================================================
#  GLOBAL PARAMETERS
# ==============================================================
global:
  fixed_notional_usdt: 15.0        # размер позиции
  leverage: 5
  min_natr_trade_pct: 0.8          # минимальная волатильность (NATR%) для допуска
  atr_period: 14
  ema_fast: 20
  ema_slow: 200
  rsi_period: 2
  update_interval_sec: 120         # анализ/цикл обновления
  trailing_update_sec: 2
  order_check_sec: 15
  timezone: "UTC"
  regime_skip_below_natr: 0.8
  version: "v1.0"