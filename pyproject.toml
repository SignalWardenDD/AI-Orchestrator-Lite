[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator-alpha"
version = "1.0.0"
description = "Modular trading orchestrator architecture"
authors = [{name = "Orchestrator Team"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "python-binance>=1.0.0",
    "lightgbm>=3.3.0",
    "catboost>=1.2.0",
    "scikit-learn>=1.3.0",
    "apscheduler>=3.10.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "parquet>=1.0.0",
    "sqlite3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrator*"]
