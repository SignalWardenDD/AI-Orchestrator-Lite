# ==============================================================
#  SYMBOL CONFIGURATION — ACTIVE PORTFOLIO (10 pairs)
# ==============================================================
# Группы разделены по волатильности:
#   A — умеренные, плавные тренды (меньше ложных сигналов)
#   B — спайковые, импульсные активы (шире ATR-буферы, SL выше)
# ==============================================================

A_group:
  ADAUSDT:
    type: "A"
    atr_sl_mult: 2.0
    atr_buf_long: 0.05
    atr_buf_short: 0.10
    tick_size: 0.0001
    step_size: 1
  HBARUSDT:
    type: "A"
    atr_sl_mult: 2.0
    atr_buf_long: 0.05
    atr_buf_short: 0.10
    tick_size: 0.00001
    step_size: 1
  LTCUSDT:
    type: "A"
    atr_sl_mult: 2.0
    atr_buf_long: 0.05
    atr_buf_short: 0.10
    tick_size: 0.01
    step_size: 0.01

B_group:
  PNUTUSDT:
    type: "B"
    atr_sl_mult: 2.2
    atr_buf_long: 0.07
    atr_buf_short: 0.12
    tick_size: 0.0001
    step_size: 1
  WIFUSDT:
    type: "B"
    atr_sl_mult: 2.2
