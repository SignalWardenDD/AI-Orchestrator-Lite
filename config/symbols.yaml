    atr_sl_mult: 2.2
    atr_buf_long: 0.07
    atr_buf_short: 0.12
    tick_size: 0.00001
    step_size: 1
  ARBUSDT:
    type: "B"
    atr_sl_mult: 2.2
    atr_buf_long: 0.07
    atr_buf_short: 0.12
    tick_size: 0.0001
    step_size: 1
  SUIUSDT:
    type: "B"
    atr_sl_mult: 2.2
    atr_buf_long: 0.07
    atr_buf_short: 0.12
    tick_size: 0.0001
    step_size: 1
  SEIUSDT:
