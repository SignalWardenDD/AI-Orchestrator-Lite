# ==============================================================
#  ORCHESTRATOR-ALPHA v1.0 — MAIN SETTINGS
# ==============================================================

engine:
  base_tf: "1h"
  micro_tf: "15m"
  loop_analyze_sec: 120
  loop_ordercheck_sec: 15
  loop_tp_sl_sec: 2
  postonly_ttl_sec_min: 8
  postonly_ttl_sec_max: 12
  slippage_cap_pct: 0.12
  score_min_usdt: 0.12
  time_weight_alpha: 0.05     # E_adj = E/(1 + alpha * median(t_hit_first))
  cooldown_seconds: 0         # кулдауны не нужны
  trend_weight: 0.20          # тренд не ключевой — даём жить контртренду
  ev_min_r: 0.10              # чуть ниже порог для большей активности (контроль риском)
  
  # ML Forecast Settings
  forecast:
    enabled: true
    ml_models: true
    models_dir: "data/models"
    auto_load: true
    fallback_to_noml: true

# BTC Context Settings
btc_context:
  weight_bonus_trend_gt: 0.7
  weight_penalty_brk_lt: 0.3
  max_delta_for_recheck: 0.15

# ML Integration Settings
ml:
  enabled: true
  config_path: "config/models_individual_optimized.yaml"  # путь к конфигурации индивидуальных моделей
  calibrator_prefer: "isotonic"   # "platt" or "isotonic"
  prob_weight_base: 1.0           # 1.0 = не менять EV при p=0.5
  prob_weight_gain: 1.0           # 1.0 = влияние умеренное; 1.5–2.0 усилит
  min_auc_threshold: 0.45         # минимальный AUC для использования модели
  
  # Individual Models Settings
  individual_models:
    enabled: true
  
  # Per-signal models configuration (OPTIMIZED)
  models_per_signal:
    yaml_path: "config/optimized/models_per_signal_optimized.yaml"
    enabled: true
  models_individual:
    yaml_path: "config/optimized/models_individual_optimized.yaml"
    config_path: "config/optimized/models_individual_optimized.yaml"
    fallback_to_group_models: true
    auto_disable_weak_models: true
    ensemble_weights:
      quality_based: true
      default_h12_weight: 0.5
      default_h24_weight: 0.5
      model_path: "data/models/trinary_ADAUSDT_and_6_more_H24.joblib"
      prob_weight_gain: 0.8
  
  # Calibration Settings
  calibration:
    default_kind: "isotonic"  # "platt" or "isotonic"
    fallback_to_platt: true
    min_probability: 0.01
    max_probability: 0.99
  
  # Feature Settings
  features:
    min_bars: 220
    include_symbol_onehot: true
    fallback_to_zeros: true
  
  # Performance Settings
  performance:
    cache_features: true
    cache_ttl_seconds: 300
    batch_predictions: true

# Signal Provider Settings
signals:
  breakout:
    enabled: true
    calm_natr_pct: 0.8
    squeeze_pct: 0.70
    c_mult_a: 1.2
    c_mult_b: 1.3
  pullback_mr:
    enabled: true
    window_bars: 4
    req_hook: true
    tail_atr_min: 0.6
  trend:
    enabled: true
    adx_min: 18.0
    micro_pull_atr: [0.2, 0.3]
  bollinger_play:
    enabled: true
    squeeze_pct: 0.70
    bandwidth_boom: 2.5

# Guard Settings
guards:
  edge_guard:
    enabled: true
    calm_natr_pct: 0.8
    edge_body_atr: 1.4
    dist_ema20_atr_min: 1.2
    rsi2_ext_hi: 98.0
    rsi2_ext_lo: 2.0
  conversions:
    enabled: true
    retest_pull_atr: 0.25
  realtime_recheck:
    enabled: true
    fresh_cancel_gt: 0.5
    fresh_adapt_min: 0.3
    ttl_scenario_min: 6
    ttl_scenario_max: 12

# Execution Settings
execution:
  entry:
    postonly_ttl_min: 8
    postonly_ttl_max: 12
    slippage_cap_pct: 0.12
    market_fallback: true
    use_limit_maker: true     # настоящие maker-ордера на Binance Futures
  exits:
    tp_ladder:
      tp1: [0.20, 0.6]    # 20% @ +0.6×ATR
      tp2: [0.25, 1.2]    # 25% @ +1.2×ATR
      tp3: [0.25, 2.0]    # 25% @ +2.0×ATR
      tp4: [0.30, 3.2]    # 30% @ +3.2×ATR
    sl_multipliers:
      BRK: 1.3
      PB: 2.0
      TRND: 1.8
      BB: 1.6
    be_levels:
      after_tp1: 0.15
      after_tp2: 0.35
      after_tp3: 0.80
  # PnL-based targets
  pnl_targets_usd:
    tp1_usd: 0.15             # используем для «перевода SL» триггер
    sl_to_usd_on_tp1: -0.05   # после +$0.15 двигаем SL на −$0.05
  
  # Многоступенчатый трейлинг SL
  pnl_trailing_usd:
    steps:
      - trigger_usd: 0.15
        new_sl_pnl_usd: -0.05
      - trigger_usd: 0.20
        new_sl_pnl_usd: 0.10
      - trigger_usd: 0.30
        new_sl_pnl_usd: 0.15
  
  base_stop_usd: -0.35        # базовый SL от входа в $PnL
  partial_tps:
    - { share: 0.70, kind: "limit", from_entry_usd: +0.20 }  # 70% на +$0.20
    - { share: 0.30, kind: "limit", from_entry_usd: +0.35 }  # 30% на +$0.35

# Risk Management Settings
risk:
  daily_loss_usdt: -7.5
  weekly_max_neg_days: 3
  position_sizing:
    fixed_notional_usdt: 15.0  # фиксированный размер позиции
    leverage: 5
  limits:
    min_natr_trade_pct: 0.8
    max_positions_per_symbol: 1
    max_total_positions: 4  # максимум 4 одновременных позиции
  max_open_positions_global: 4
  max_open_positions_per_symbol: 1

# Telemetry Settings
telemetry:
  audit:
    enabled: true
    level: "INFO"
  reports:
    daily: true
    weekly: true
    format: "json"
  storage:
    type: "csv"
    directory: "logs"
    retention_days: 30

# Reconciliation Settings
reconciliation:
  enabled: true
  interval_seconds: 15      # как и раньше — частая, но щадящая сверка
  hysteresis_pct: 0.06      # анти-чурнинг: если расхождение < 0.06% — не трогаем
  max_batch_cancel: 6       # не более N отмен за один проход
  max_batch_create: 6       # не более N дозаводов за один проход
  respect_improvements: true  # НЕ ухудшать SL/TP
  roles: ["ENTRY", "SL", "TP1", "TP2"]  # ожидаемые роли

# API Settings
api:
  enabled: true
  host: "localhost"
  port: 8000
  health_check: true
  metrics: true

# System Settings
system:
  timezone: "UTC"
  version: "v1.0"
  debug: false
  log_level: "INFO"
