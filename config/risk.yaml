# ==============================================================
#  RISK MANAGEMENT CONFIGURATION
# ==============================================================

position:
  fixed_notional_usdt: 15.0
  leverage: 5

limits:
  daily_loss_usdt: -7.5
  weekly_streak_pause_spiky: 3  # 3 подряд красных дня -> пауза «спайковых» пар
  min_natr_trade_pct: 0.8
  max_positions_per_symbol: 1
  max_total_positions: 7

# SL Multipliers by Signal Type
sl_multipliers:
  BRK: 1.3
  PB: 2.0
  TRND: 1.8
  BB: 1.6

# Position Sizing by Symbol Group
position_sizing:
  A_group:
    fixed_notional_usdt: 15.0
    leverage: 5
    atr_sl_mult: 2.0
  B_group:
    fixed_notional_usdt: 15.0
    leverage: 5
    atr_sl_mult: 2.2

# Risk Filters
filters:
  calm_market:
    enabled: true
    natr_threshold: 0.8
    action: "skip"
  
  volatility_spike:
    enabled: true
    natr_multiplier: 3.0
    action: "reduce_size"
  
  correlation:
    enabled: true
    max_correlation: 0.95
    window: 48
    action: "skip"

# Daily/Weekly Limits
daily_limits:
  max_loss_usdt: -7.5
  max_trades: 50
  max_new_positions: 3

weekly_limits:
  max_negative_days: 3
  max_drawdown_pct: 15.0
  pause_spiky_pairs: true

# Emergency Stops
emergency:
  max_slippage_pct: 0.5
  max_fill_time_sec: 30
  max_consecutive_losses: 5
  auto_pause_on_error: true
